<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="100" fill="#0d1117" rx="8"/>
  
  <!-- AI Brain Icon -->
  <g transform="translate(20, 25)">
    <!-- Brain outline -->
    <path d="M 25 10 Q 15 5, 10 10 Q 5 15, 5 25 Q 5 35, 10 40 Q 15 45, 25 40 Q 35 45, 40 40 Q 45 35, 45 25 Q 45 15, 40 10 Q 35 5, 25 10 Z" 
          fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    
    <!-- Neural connections -->
    <circle cx="15" cy="20" r="2.5" fill="#c4b5fd"/>
    <circle cx="25" cy="15" r="2.5" fill="#c4b5fd"/>
    <circle cx="35" cy="20" r="2.5" fill="#c4b5fd"/>
    <circle cx="20" cy="30" r="2.5" fill="#c4b5fd"/>
    <circle cx="30" cy="30" r="2.5" fill="#c4b5fd"/>
    
    <line x1="15" y1="20" x2="25" y2="15" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="25" y1="15" x2="35" y2="20" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="20" x2="20" y2="30" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="20" x2="30" y2="30" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="30" x2="30" y2="30" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Arrow/Lightning transition -->
  <g transform="translate(70, 35)">
    <path d="M 0 10 L 10 10 L 5 0 L 15 15 L 5 15 L 10 25" 
          fill="#22d3ee" opacity="0.8"/>
  </g>
  
  <!-- Terminal prompt symbol -->
  <g transform="translate(95, 30)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="50" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Prompt > -->
    <text x="8" y="28" font-family="monospace" font-size="24" font-weight="bold" fill="#10b981">&gt;_</text>
  </g>
  
  <!-- Text: aiexec -->
  <text x="160" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#e2e8f0">
    ai<tspan fill="#22d3ee">exec</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="160" y="75" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    AI-powered command execution
  </text>
</svg>
